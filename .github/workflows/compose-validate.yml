name: compose-validate

on: [push, pull_request]

jobs:
  config:
    runs-on: ubuntu-24.04
    env:
      DATA_PATH: /tmp/inception-data
    steps:
      - uses: actions/checkout@v4
      - name: ダミー .env を用意
        run: |
          printf 'DATA_PATH=%s\n' "$DATA_PATH" > srcs/.env
      - name: docker compose config
        run: docker compose -f srcs/docker-compose.yml config
