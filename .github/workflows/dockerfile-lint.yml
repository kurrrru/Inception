name: dockerfile-lint

on: [push, pull_request]

jobs:
  hadolint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - srcs/requirements/nginx/Dockerfile
          - srcs/requirements/mariadb/Dockerfile
          - srcs/requirements/wordpress/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

  alpine-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: FROM alpine が固定 & penultimate 安定版か
        run: |
          fail=0
          minors=$(curl -fsSL https://dl-cdn.alpinelinux.org/alpine/ \
                    | grep -oE 'v3\.[0-9]+' | sort -uV -r || true)
          latest=$(echo "$minors" | sed -n '1p' | tr -d 'v')
          penult=$(echo "$minors" | sed -n '2p' | tr -d 'v')
          echo "最新安定版: ${latest:-?} / subject が要求する penultimate: ${penult:-?}"
          while IFS= read -r line; do
            img=$(echo "$line" | awk '{print $2}')
            case "$img" in
              alpine|alpine:latest|alpine:edge)
                echo "::error::$img はバージョン未固定(または禁止タグ)です"; fail=1 ;;
              alpine:*)
                ver=${img#alpine:}; minor=$(echo "$ver" | grep -oE '^[0-9]+\.[0-9]+')
                echo "検出: alpine:$ver"
                if [ -n "$penult" ] && [ "$minor" != "$penult" ]; then
                  echo "::warning::subject は penultimate 安定版($penult 系)を要求。現在は $minor 系です(情報のみ)"
                fi ;;
            esac
          done < <(grep -rhiE '^FROM ' srcs/requirements/*/Dockerfile)
          exit $fail
