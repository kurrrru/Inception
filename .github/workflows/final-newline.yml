name: final-newline

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 追跡ファイルが末尾改行で終わっているか
        run: |
          fail=0
          # バイナリ判定はしない。push するバイナリがあればここで明示除外する:
          #   done < <(git ls-files -- . ':!:docs/architecture.png' ':!:*.ico')
          while IFS= read -r f; do
            [ -s "$f" ] || continue                       # 空ファイルは対象外
            if [ "$(tail -c1 "$f" | wc -l)" -eq 0 ]; then  # 末尾が \n でない
              echo "::error file=$f::末尾に改行がありません"
              fail=1
            fi
          done < <(git ls-files)
          exit $fail
