name: forbidden-patterns

on: [push, pull_request]

jobs:
  grep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 無限ループ/keepalive ハック (subject p.8/9)
        run: |
          # tail -f / sleep infinity / while true
          if grep -rnE 'tail[[:space:]]+-f|sleep[[:space:]]+infinity|while[[:space:]]+true' srcs/; then
            echo "::error::禁止パターン(tail -f / sleep infinity / while true)が見つかりました"
            exit 1
          fi
      - name: 禁止ネットワーク設定 (host network / link)
        run: |
          # network_mode: host / --link / links:
          if grep -rnE 'network_mode:[[:space:]]*"?host"?|--link|(^|[[:space:]])links:' srcs/; then
            echo "::error::禁止ネットワーク設定(host network / link)が見つかりました"
            exit 1
          fi
