name: secret-scan

on: [push, pull_request]

permissions:
  contents: read          # checkout / リポジトリ読み取り
  pull-requests: read     # gitleaks-action が PR のコミット一覧を取得するために必要

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secrets-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: secrets/ に .gitkeep 以外が commit されていないか
        run: |
          tracked=$(git ls-files secrets/ | grep -v '^secrets/.gitkeep$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::secrets/ に想定外のファイルがあります:"; echo "$tracked"; exit 1
          fi
      - name: .env が commit されていないか
        run: |
          if git ls-files --error-unmatch srcs/.env >/dev/null 2>&1; then
            echo "::error::srcs/.env が commit されています"; exit 1
          fi
