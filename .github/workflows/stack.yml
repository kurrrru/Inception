name: stack

on: [push, pull_request]

jobs:
  up:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: .env を用意
        run: |
          # 実装が進んだら実際に必要な変数(DB/WP 認証情報など)へ更新する
          cat > srcs/.env <<'EOF'
          DOMAIN_NAME=login.42.fr
          DATA_PATH=/home/runner/data
          EOF
      - name: secrets を用意 (Docker secrets を配線したら使用)
        run: |
          mkdir -p secrets
          echo "ci-db-password"       > secrets/db_password.txt
          echo "ci-db-root-password"  > secrets/db_root_password.txt
          echo "ci-wp-admin-password" > secrets/credentials.txt
      - name: ビルド & 起動
        run: make
      - name: コンテナ状態
        run: docker compose -f srcs/docker-compose.yml ps
      - name: NGINX が 443 で応答するか
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -k -sSf https://localhost:443 -o /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::https://localhost:443 に到達できません"
            docker compose -f srcs/docker-compose.yml logs
            exit 1
          fi
      - name: TLS が 1.2/1.3 のみか
        run: |
          # TLSv1.1 以下は拒否されるべき
          if curl -k --tlsv1.1 --tls-max 1.1 https://localhost:443 -o /dev/null 2>/dev/null; then
            echo "::error::TLSv1.1 が有効になっています"; exit 1
          fi
          curl -k --tlsv1.2 https://localhost:443 -o /dev/null
      - name: 後始末
        if: always()
        run: docker compose -f srcs/docker-compose.yml down -v || true
