services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - /home/nkawaguc/data/db:/var/lib/mysql
    networks:
      - inception
    restart: always
  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file:
      - .env
    volumes:
      - /home/nkawaguc/data/wp:/var/www/html
    depends_on:
      - mariadb
    networks:
      - inception
    restart: always
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    env_file:
      - .env
    volumes:
      - /home/nkawaguc/data/wp:/var/www/html
    networks:
      - inception
    restart: always

networks:
  inception:
    driver: bridge